<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Sport Muscle</title>
<style>
  :root {
    --bg: #050505;
    --red: #e4161c;
    --red-dark: #a80f14;
    --white: #ffffff;
    --card: #121212;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(circle at 50% 0%, #1a0405 0%, var(--bg) 60%);
    color: var(--white);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
  }
  .wrap { width: 100%; max-width: 420px; text-align: center; }

  .logo-img { display:block; width:100%; max-width:380px; height:auto; margin:0 auto 40px; }

  .btn {
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 16px 18px; margin-bottom: 14px;
    border-radius: 16px; text-decoration: none; color: var(--white);
    font-size: 17px; font-weight: 700; letter-spacing: .3px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 26px; height: 26px; flex: none; fill: currentColor; }
  .btn small { display: block; font-weight: 500; font-size: 13px; opacity: .85; margin-top: 2px; }
  .btn .txt { text-align: left; flex: 1; }
  .btn .arrow { width: 18px; height: 18px; opacity: .8; }

  .b1 { background: linear-gradient(135deg, var(--red), var(--red-dark)); box-shadow: 0 8px 22px #e4161c55; }
  .b2 { background: var(--white); color: #111; box-shadow: 0 8px 22px #ffffff22; }
  .b3 { background: var(--card); border: 2px solid var(--red); box-shadow: 0 8px 22px #e4161c22; }

  .foot { margin-top: 22px; font-size: 12px; color: #777; letter-spacing: 1px; }

  @media (max-height: 640px) {
    .logo-img { margin-bottom: 24px; }
    .btn { padding: 12px 16px; margin-bottom: 10px; }
  }
  .lang { position: fixed; top: calc(env(safe-area-inset-top) + 14px); right: 16px; display: flex;
    background: #151515; border: 1px solid #2a2a2a; border-radius: 999px; padding: 3px; z-index: 5; }
  .lang button { border: 0; background: transparent; color: #aaa; font: 700 13px/1 inherit; font-family: inherit;
    padding: 8px 14px; border-radius: 999px; cursor: pointer; letter-spacing: 1px; }
  .lang button.on { background: var(--red); color: #fff; }
  .btn small { line-height: 1.3; }
</style>
</head>

    <div id="links"></div>

    <p class="foot">© Sport Muscle</p>
  </main>

<script>
  // ====== SOZLAMALAR ======
  const CONFIG = {
    telegram: "https://t.me/sportmuscle_uz",
    phone: "+998931245222",
    phoneLabel: "+998 93 124 52 22",
    lat: 41.30380836186238,
    lon: 69.23443016369337
  };

  const T = {
    uz: { call: "Qo'ng'iroq", loc: "Lokatsiya", addr: "Bunyodkor shoh ko'chasi (dublyor), Toshkent" },
    ru: { call: "Позвонить",  loc: "Локация",   addr: "проспект Бунёдкор (дублёр), Ташкент" }
  };

  const webMap = `https://yandex.uz/maps/?pt=${CONFIG.lon},${CONFIG.lat}&z=17&l=map`;
  const appMap = `yandexmaps://maps.yandex.ru/?pt=${CONFIG.lon},${CONFIG.lat}&z=17&l=map`;

  const icons = {
    telegram: '<svg viewBox="0 0 24 24"><path d="M21.9 4.1 18.6 19.6c-.2 1-.9 1.3-1.7.8l-4.8-3.6-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.9 8.9-8c.4-.3-.1-.5-.6-.2L6.4 13.3 1.7 11.8c-1-.3-1-1 .2-1.5L20.3 3.2c.9-.3 1.6.2 1.6.9z"/></svg>',
    phone: '<svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>',
    pin: '<svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>',
    arrow: '<svg class="arrow" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  let lang = "uz";
  try { lang = localStorage.getItem("lang") || (/^ru/i.test(navigator.language) ? "ru" : "uz"); } catch (e) {}

  function render() {
    const t = T[lang];
    const buttons = [
      { cls: "b1", icon: "telegram", title: "Telegram", sub: "@sportmuscle_uz", href: CONFIG.telegram },
      { cls: "b2", icon: "phone",    title: t.call,     sub: CONFIG.phoneLabel, href: "tel:" + CONFIG.phone },
      { cls: "b3", icon: "pin",      title: t.loc,      sub: t.addr,            href: webMap, map: true }
    ];
    document.getElementById("links").innerHTML = buttons.map(b => `
      <a class="btn ${b.cls}" href="${b.href}" ${b.map ? 'data-map="1"' : ""} target="_blank" rel="noopener">
        ${icons[b.icon]}
        <span class="txt">${b.title}<small>${b.sub}</small></span>
        ${icons.arrow}
      </a>`).join("");
    document.documentElement.lang = lang;
    document.querySelectorAll(".lang button").forEach(x => x.classList.toggle("on", x.dataset.l === lang));
  }

  document.querySelector(".lang").addEventListener("click", e => {
    const l = e.target.dataset && e.target.dataset.l;
    if (!l) return;
    lang = l;
    try { localStorage.setItem("lang", l); } catch (err) {}
    render();
  });

  // Lokatsiya: telefonda Yandex Xarita ilovasini ochadi, ilova bo'lmasa brauzerda
  document.getElementById("links").addEventListener("click", e => {
    const a = e.target.closest("a[data-map]");
    if (!a || !/Android|iPhone|iPad/i.test(navigator.userAgent)) return;
    e.preventDefault();
    const t0 = Date.now();
    window.location.href = appMap;
    setTimeout(() => { if (!document.hidden && Date.now() - t0 < 2000) window.location.href = webMap; }, 1000);
  });

  render();
</script>
